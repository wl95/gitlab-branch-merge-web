<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitLab 分支合并管理台</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --card: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #fc6d26;
    --accent-dark: #e8590c;
    --ok: #3fb950;
    --err: #f85149;
    --warn: #d29922;
    --log-bg: #0a0e14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 24px;
    background: rgba(13,17,23,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-radius: 9px; color: #fff;
  }
  .logo svg { width: 20px; height: 20px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text);
    font-size: 14px; cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none; color: #fff; font-weight: 600;
    box-shadow: 0 4px 14px rgba(252,109,38,.3);
  }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  .btn.add { border-style: dashed; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }

  /* ---------- 布局 ---------- */
  main {
    display: block;
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 24px 110px;  /* 底部预留浮动面板空间 */
    width: 100%;
  }
  .cards-area { width: 100%; }
  .panel-title {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; font-size: 15px; font-weight: 600;
  }
  .panel-title .count {
    font-size: 12px; color: var(--muted); font-weight: 400;
    background: var(--card); border: 1px solid var(--border);
    padding: 2px 10px; border-radius: 20px;
  }

  /* ---------- 工程卡片 ---------- */
  #cards {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px 18px;
    transition: border-color .15s;
  }
  .card:hover { border-color: #3d444d; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; padding-bottom: 12px;
    border-bottom: 1px dashed var(--border);
  }
  .chk {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted); cursor: pointer;
    user-select: none;
  }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .del {
    width: 28px; height: 28px; border: none; border-radius: 7px;
    background: transparent; color: var(--muted); font-size: 15px;
    cursor: pointer; transition: all .15s; line-height: 1;
  }
  .head-actions { display: flex; gap: 6px; }
  .refresh-br {
    width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 7px;
    background: transparent; color: var(--muted); font-size: 13px; line-height: 1;
    cursor: pointer; transition: all .15s; position: relative;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .refresh-br:hover { color: var(--accent); border-color: var(--accent); }
  .refresh-br.loading {
    border-color: var(--accent);
    pointer-events: none;
  }
  .refresh-br.loading::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid rgba(252,109,38,.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: brspin .8s linear infinite;
  }
  @keyframes brspin { to { transform: rotate(360deg); } }

  /* ---------- 全局分支面板 ---------- */
  .global-panel {
    background: var(--panel);
    border: 1px solid rgba(252,109,38,.28);
    border-radius: 12px;
    padding: 14px 16px 12px;
    margin: 0 0 22px 0;
    box-shadow: 0 4px 14px rgba(252,109,38,.04);
  }
  .gp-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .gp-head .gp-icon { font-size: 16px; }
  .gp-head .gp-title { font-size: 14px; font-weight: 600; color: var(--accent); }
  .gp-head .gp-tip {
    font-size: 12px; color: var(--muted); font-weight: 400;
    margin-left: 4px; line-height: 1.5;
  }
  .gp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .gp-grid > div { min-width: 0; }
  .gp-grid label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 6px;
  }
  .gp-foot {
    display: flex; gap: 10px; align-items: center;
    margin-top: 14px; flex-wrap: wrap;
  }
  .gp-foot > input { flex: 1; min-width: 240px; }
  .gp-foot .btn { flex: 0 0 auto; }
  @media (max-width: 760px) {
    .gp-grid { grid-template-columns: 1fr; }
  }

  /* ---------- 分支选择器 ---------- */
  .bp-wrap { position: relative; }
  .bp-dropdown {
    position: fixed;            /* 浮层：脱离任何 stacking / overflow 限制 */
    z-index: 1000;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 14px 36px rgba(0,0,0,.55);
    max-height: min(70vh, 460px);
    overflow-y: auto;
    display: none;
    overscroll-behavior: contain;
  }
  .bp-dropdown.show { display: block; }
  .bp-dropdown::-webkit-scrollbar { width: 8px; }
  .bp-dropdown::-webkit-scrollbar-track { background: rgba(255,255,255,.02); border-radius: 4px; }
  .bp-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .bp-dropdown::-webkit-scrollbar-thumb:hover { background: #4d5660; }
  .bp-item {
    padding: 7px 10px; font-size: 12.5px; cursor: pointer;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    display: flex; align-items: center; gap: 8px;
  }
  .bp-item .bp-name {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bp-item .ck {
    flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px;
    font-size: 12px; font-weight: 700; line-height: 1;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    border-radius: 4px;
    background: transparent; color: transparent;
    border: 1px solid var(--border);
  }
  .bp-item:hover { background: rgba(252,109,38,.1); }
  .bp-item.sel {
    background: rgba(252,109,38,.16);
    color: var(--accent); font-weight: 600;
  }
  .bp-item.sel .ck {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .bp-item.sel:hover { background: rgba(252,109,38,.24); }
  .bp-item.empty {
    color: var(--muted); cursor: default; font-family: inherit; white-space: normal;
    display: block;
  }
  .bp-divider {
    height: 1px; margin: 4px 6px; background: var(--border); opacity: .6;
  }

  /* ---------- Commit Pick 抽屉 ---------- */
  .pick-toggle { width: 100%; justify-content: center; font-size: 13px; padding: 8px; }
  .pick-backdrop {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .pick-backdrop.show { opacity: 1; pointer-events: auto; }
  .pick-drop {
    position: fixed; top: 0; right: -680px; z-index: 1000;
    width: 640px; max-width: calc(100vw - 40px); height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 40px rgba(0,0,0,.6);
    display: none;
    flex-direction: column;
    transition: right .3s cubic-bezier(.25,.8,.25,1);
    padding: 0;
  }
  .pick-drop.show {
    right: 0;
    display: flex;
  }
  .pk-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .pk-title { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .pk-close {
    margin-left: auto;
    width: 28px; height: 28px;
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .pk-close:hover { color: var(--text); border-color: var(--accent); }
  .pk-head select, .pk-foot select {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12.5px; outline: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .pk-head select:focus, .pk-foot select:focus { border-color: var(--accent); }
  .pk-search-wrap { padding: 10px 16px 0; flex: none; }
  .pk-search {
    width: 100%; box-sizing: border-box;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 12.5px; outline: none;
  }
  .pk-search:focus { border-color: var(--accent); }
  .pk-list-wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px; }
  .pk-list-wrap::-webkit-scrollbar { width: 8px; }
  .pk-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .pk-list { display: flex; flex-direction: column; gap: 8px; }
  .pk-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    transition: all .15s;
  }
  .pk-item:hover {
    border-color: rgba(252,109,38,.35);
    background: rgba(252,109,38,.04);
  }
  .pk-item input[type=checkbox] { display: none; }
  .pk-check-custom {
    width: 18px; height: 18px;
    border: 2px solid var(--border); border-radius: 4px;
    margin-top: 2px; flex: none;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .pk-item:hover .pk-check-custom { border-color: var(--accent); }
  .pk-item input:checked ~ .pk-check-custom {
    background: var(--accent); border-color: var(--accent);
  }
  .pk-check-custom::after {
    content: ''; width: 5px; height: 9px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
    opacity: 0; transition: opacity .15s;
  }
  .pk-item input:checked ~ .pk-check-custom::after { opacity: 1; }
  .pk-info { flex: 1; min-width: 0; }
  .pk-msg { font-size: 13.5px; line-height: 1.5; color: var(--text); margin-bottom: 6px; }
  .pk-meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pk-sha {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    background: rgba(252,109,38,.12); color: var(--accent);
    padding: 1px 6px; border-radius: 4px;
  }
  .pk-author, .pk-date { font-size: 11.5px; color: var(--muted); }
  .pk-empty { color: var(--muted); font-size: 12.5px; padding: 24px 6px; text-align: center; }
  .pk-target-section {
    border-top: 1px dashed var(--border);
    padding: 10px 16px 16px;
    flex: none;
  }
  .pk-target-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .pk-target-label {
    font-size: 12px; font-weight: 700; color: var(--accent);
    white-space: nowrap;
  }
  .pk-target-list {
    max-height: 200px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pk-target-list::-webkit-scrollbar { width: 6px; }
  .pk-target-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .pk-item-readonly {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(255,255,255,.02);
  }
  .pk-item-readonly .pk-readonly-badge {
    flex: none; font-size: 10px; color: var(--muted);
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 3px; margin-top: 2px;
  }
  .pk-foot {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: rgba(13,17,23,.6);
    flex: none;
  }
  .pk-foot .pk-run { flex: none; white-space: nowrap; font-size: 13px; padding: 8px 16px; }
  /* loading spinner in drawer list */
  .pk-loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 40px 10px; color: var(--muted); font-size: 13px;
  }
  .pk-loading .pk-spin {
    width: 22px; height: 22px;
    border: 2px solid rgba(252,109,38,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: pkspin .8s linear infinite;
  }
  @keyframes pkspin { to { transform: rotate(360deg); } }

  .bp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .bp-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(252,109,38,.12); border: 1px solid rgba(252,109,38,.35);
    color: #fc8a4a; font-size: 12px; border-radius: 6px; padding: 2px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace; max-width: 100%;
  }
  .bp-tag .bt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bp-tag .x { cursor: pointer; opacity: .7; font-weight: 700; }
  .bp-tag .x:hover { opacity: 1; }
  .del:hover { background: rgba(248,81,73,.12); color: var(--err); }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 5px;
  }
  .field label .req { color: var(--accent); }
  input, textarea {
    width: 100%; padding: 9px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13px; font-family: inherit;
    transition: border-color .15s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; line-height: 1.5; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  input:disabled, textarea:disabled { opacity: .55; }

  /* ---------- 执行面板（右下浮动抽屉） ---------- */
  .exec-panel {
    position: fixed;
    right: 20px; bottom: 20px;
    width: 400px;
    max-height: min(70vh, 640px);
    z-index: 90;
    background: var(--panel);
    border: 1px solid rgba(252,109,38,.25);
    border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.55);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: max-height .25s ease;
  }
  .exec-panel.collapsed {
    max-height: 54px;
    border-color: var(--border);
  }
  .exec-panel.collapsed .merge-queue-wrap,
  .exec-panel.collapsed #log,
  .exec-panel.collapsed .exec-foot { display: none; }
  .exec-panel.collapsed .exec-head { padding: 12px 16px; border-bottom: none; }
  .exec-toggle {
    width: 28px; height: 28px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin-left: 8px;
    transition: transform .2s, color .15s, border-color .15s;
  }
  .exec-toggle:hover { color: var(--text); border-color: var(--accent); }
  .exec-panel.collapsed .exec-toggle { transform: rotate(180deg); }
  .merge-queue-wrap {
    border-bottom: 1px solid var(--border);
    background: rgba(252,109,38,.04);
  }
  .merge-queue-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .queue-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .queue-count {
    background: var(--accent); color: #fff; border-radius: 10px;
    padding: 1px 8px; font-size: 11px; font-weight: 600; min-width: 22px; text-align: center;
  }
  .merge-queue {
    max-height: 220px; overflow-y: auto; padding: 8px 12px;
  }
  .merge-queue .queue-empty { color: var(--muted); font-size: 12px; padding: 8px 4px; text-align: center; }
  .qitem {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
  }
  .qitem:last-child { margin-bottom: 0; }
  .qitem .qname { font-weight: 600; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .qitem .qname .qname-text { flex: 1; word-break: break-all; }
  .qitem .qflow { color: var(--muted); line-height: 1.6; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
  .qitem .qflow .qsource { color: #4ea1ff; }
  .qitem .qflow .qarrow { color: var(--accent); padding: 0 4px; }
  .qitem .qflow .qtarget { color: #d2a8ff; }
  .qitem.warn { border-color: #e3a00855; background: rgba(227,160,8,.06); }
  .qitem .qwarn { color: #e3a008; font-size: 11px; margin-top: 4px; }
  .exec-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .exec-head h2 { font-size: 15px; font-weight: 600; }
  .spinner {
    width: 15px; height: 15px; display: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #log {
    height: 460px; overflow-y: auto; padding: 12px 14px;
    background: var(--log-bg);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  }
  #log .empty { color: #484f58; text-align: center; margin-top: 30px; }
  #log .info { color: #c9d1d9; }
  #log .warn { color: var(--warn); }
  #log .error { color: var(--err); }
  .exec-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .exec-foot .btn { padding: 7px 14px; font-size: 13px; }
  .exec-status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.running { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* ---------- 扫描面板 ---------- */
  .scan-panel {
    background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 20px;
  }
  .scan-row { display: flex; gap: 10px; align-items: center; }
  .scan-row input { flex: 1; }
  .scan-hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .scan-list { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; display: none; }
  .scan-list.show { display: block; }
  .scan-list-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--muted); margin-bottom: 10px;
  }
  #scanItems {
    max-height: 380px;
    overflow-y: auto;
    padding-right: 6px;
  }
  #scanItems::-webkit-scrollbar { width: 8px; }
  #scanItems::-webkit-scrollbar-track { background: rgba(255,255,255,.02); border-radius: 4px; }
  #scanItems::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #scanItems::-webkit-scrollbar-thumb:hover { background: #4d5660; }
  .scan-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; cursor: pointer; transition: all .15s;
  }
  .scan-item:hover { border-color: #3d444d; }
  .scan-item.selected { border-color: var(--accent); background: rgba(252,109,38,.06); }
  .scan-item input { width: 16px; height: 16px; flex: none; margin-top: 3px; accent-color: var(--accent); cursor: pointer; }
  .scan-item .info { flex: 1; min-width: 0; }
  .scan-item .sname { font-size: 14px; font-weight: 600; color: var(--text); }
  .scan-item .surl {
    font-size: 12px; color: var(--muted); margin-top: 3px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all; white-space: pre-wrap;
  }
  .scan-item.selected .surl { color: var(--accent); }
  .scan-actions { margin-top: 12px; display: flex; gap: 10px; }
  .scan-empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .scan-loading { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .scan-loading .spinner { display: inline-block; margin-right: 6px; vertical-align: -2px; }

  /* ---------- 提示 ---------- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 22px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    opacity: 0; transition: all .3s; z-index: 99;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { border-color: var(--err); color: var(--err); }
  #toast.ok { border-color: var(--ok); color: var(--ok); }

  @media (max-width: 1100px) {
    #cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .exec-panel { width: calc(100vw - 30px); right: 15px; bottom: 15px; }
  }
  @media (max-width: 640px) {
    #cards { grid-template-columns: 1fr; }
    .global-panel .gp-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="3" x2="6" y2="15"></line>
      <circle cx="18" cy="6" r="3"></circle>
      <circle cx="6" cy="18" r="3"></circle>
      <path d="M18 9a9 9 0 0 1-9 9"></path>
    </svg>
  </div>
  <div>
    <h1>GitLab 分支合并管理台</h1>
    <div class="sub">配置工程 · 源分支合并到多个目标分支</div>
  </div>
  <div class="header-actions">
    <button class="btn add" id="addBtn">＋ 添加工程</button>
    <button class="btn primary" id="saveBtn">保存全部</button>
  </div>
</header>

<main>
  <div class="cards-area">
    <div class="scan-panel">
      <div class="scan-row">
        <input id="scanFolder" placeholder="输入本机代码目录，如 /Users/me/work/projects">
        <button class="btn" id="scanBtn">🔍 读取</button>
      </div>
      <div class="scan-hint">
        读取该文件夹下所有 git 仓库（每个子目录的 .git/config 中的 remote origin 地址），
        按文件夹名称列出工程。勾选工程后可在下方查看对应 SSH 地址，并可一键加入配置。
      </div>
      <div id="scanList" class="scan-list"></div>
    </div>

    <div class="global-panel">
      <div class="gp-head">
        <span class="gp-icon">🌐</span>
        <span class="gp-title">全局分支设置</span>
        <span class="gp-tip">填写后点击下方「应用」即可一次性写入全部工程对应字段（覆盖卡片已有值）。</span>
      </div>
      <div class="gp-grid">
        <div>
          <label>全局源分支（输入或下拉选择）</label>
          <div class="bp-wrap">
            <input id="gSrc" placeholder="如：feature-20260630">
            <div class="bp-dropdown" id="gSrcDrop"></div>
          </div>
        </div>
        <div>
          <label>全局目标分支（可多选 / 搜索 / 自定义）</label>
          <div class="bp-wrap">
            <div class="bp-tags" id="gTags"></div>
            <input id="gTgtInput" placeholder="关键词搜索分支，Enter 添加自定义分支">
            <div class="bp-dropdown" id="gTgtDrop"></div>
            <textarea id="gTgts" hidden></textarea>
          </div>
        </div>
      </div>
      <div class="gp-foot">
        <input id="gSsh" placeholder="（可选）SSH 地址 —— 仅在点击 ⟳ 加载分支时需要">
        <button class="btn" id="gpLoad">⟳ 加载分支</button>
        <button class="btn" id="gpApplySrc">应用源分支</button>
        <button class="btn" id="gpApplyTgt">应用目标分支</button>
        <button class="btn primary" id="gpApplyAll">一键应用到全部</button>
      </div>
    </div>

    <div class="panel-title">
      工程配置
      <span class="count" id="count">0 个工程</span>
    </div>
    <div id="cards"></div>
  </div>
</main>

  <div class="exec-panel" id="execPanel">
    <div class="exec-head">
      <h2>执行合并</h2>
      <div class="exec-status">
        <span class="dot" id="dot"></span>
        <span id="statusText" style="font-size:12px;color:var(--muted)">空闲</span>
        <button class="exec-toggle" id="execToggleBtn" title="折叠 / 展开">▼</button>
      </div>
    </div>
    <div class="merge-queue-wrap">
      <div class="merge-queue-head">
        <span class="queue-title">待合并工程</span>
        <span class="queue-count" id="queueCount">0</span>
      </div>
      <div id="mergeQueue" class="merge-queue">
        <div class="queue-empty">暂未勾选「参与合并」的工程</div>
      </div>
    </div>
    <div id="log">
      <div class="empty">尚未开始执行，日志将显示在这里</div>
    </div>
    <div class="exec-foot">
      <button class="btn" id="clearLogBtn">清空日志</button>
      <button class="btn primary" id="mergeBtn">
        <span class="spinner" id="spinner"></span>
        <span id="mergeBtnText">开始合并</span>
      </button>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cardsEl = $('#cards');
  const toastEl = $('#toast');
  const logEl = $('#log');
  let busy = false;
  let lastLogId = 0;
  let pollTimer = null;
  let toastTimer = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------------- API ---------------- */
  async function api(path, method = 'GET', body) {
    const opts = { method };
    if (body) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    const r = await fetch(path, opts);
    if (!r.ok) {
      let msg = r.statusText;
      try { const j = await r.json(); msg = j.error || msg; } catch (e) {}
      throw new Error(msg);
    }
    return r.json();
  }

  /* ---------------- 下拉浮层 ---------------- */
  // 把 drop 改成 fixed 浮层，定位到 input 周围。
  // 视口下方空间不足时自动向上展开，避免被任何父级 stacking/overflow 遮挡。
  const __OPEN_DROPS__ = new Set();
  function openDrop(drop, input) {
    // 自动 fallback：若调用方没传 input，尝试从兄弟节点里取
    if (drop && !input) input = drop.parentElement && drop.parentElement.querySelector('input');
    if (!drop) return;
    if (!input) { drop.classList.add('show'); return; }
    const r = input.getBoundingClientRect();
    const cs = getComputedStyle(drop);
    const cssMax = parseInt(cs.maxHeight, 10) || 240;
    const MIN_H = 120;                          // 至少能展示几个分支
    const PAD   = 8;                            // 距离视口边缘的余量
    const spaceBelow = Math.max(window.innerHeight - r.bottom - PAD, 0);
    const spaceAbove = Math.max(r.top - PAD, 0);
    let top = '', bottom = '', usedH;
    if (spaceBelow >= cssMax || spaceBelow >= spaceAbove) {
      // 优先向下展开，把可用空间尽量用满
      top    = (r.bottom + 4) + 'px';
      bottom = '';
      usedH  = Math.max(MIN_H, Math.min(cssMax, spaceBelow));
    } else if (spaceAbove >= MIN_H) {
      // 下方不够时翻到上方
      top    = '';
      bottom = (window.innerHeight - r.top + 4) + 'px';
      usedH  = Math.max(MIN_H, Math.min(cssMax, spaceAbove));
    } else {
      // 兜底：上下都紧张，按下方实际可用空间
      top    = (r.bottom + 4) + 'px';
      bottom = '';
      usedH  = Math.max(MIN_H, spaceBelow);
    }
    drop.style.position = 'fixed';
    drop.style.left   = r.left + 'px';
    drop.style.width  = r.width + 'px';
    drop.style.top    = top;
    drop.style.bottom = bottom;
    drop.style.maxHeight = usedH + 'px';
    drop.classList.add('show');
    __OPEN_DROPS__.add(drop);
  }
  function closeDrop(drop) {
    drop.classList.remove('show');
    __OPEN_DROPS__.delete(drop);
  }
  function closeAllDrops(except) {
    [...__OPEN_DROPS__].forEach(d => { if (d !== except) closeDrop(d); });
  }

  /* ---------------- 卡片 ---------------- */
  function makeCard(p = {}) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = p.name || '';
    card.dataset.localDir = p.local_dir || '';
    card.innerHTML = `
      <div class="card-head">
        <label class="chk">
          <input type="checkbox" class="f-check">
          参与合并
        </label>
        <div class="head-actions">
          <button class="refresh-br" title="加载/刷新分支">⟳</button>
          <button class="del" title="删除工程">✕</button>
        </div>
      </div>
      <div class="field">
        <label>SSH 地址 <span class="req">*</span></label>
        <input class="f-host" value="${esc(p.ssh_host || '')}"
               placeholder="ssh://git@host:port/group/project.git 或 git@host:group/project.git">
      </div>
      <div class="field">
        <label>项目路径（可选，SSH 未写完整时必填）</label>
        <input class="f-path" value="${esc(p.project_path || '')}" placeholder="group/project">
      </div>
      <div class="field">
        <label>分支1 · 源分支 <span class="req">*</span></label>
        <div class="bp-wrap">
          <input class="f-source" value="${esc(p.source_branch || '')}" placeholder="输入或点击选择分支"
                 autocomplete="off">
          <div class="bp-dropdown src-drop"></div>
        </div>
      </div>
      <div class="field">
        <label>目标分支（可多选，支持搜索）<span class="req">*</span></label>
        <div class="bp-wrap">
          <div class="bp-tags"></div>
          <input class="f-target-input" placeholder="输入关键词搜索分支并添加" autocomplete="off">
          <div class="bp-dropdown tgt-drop"></div>
          <textarea class="f-targets" hidden>${esc((p.target_branches || []).join('\n'))}</textarea>
        </div>
      </div>
      <div class="field">
        <label>Commit Pick（下拉多选 commit，cherry-pick 到指定分支）</label>
        <div class="bp-wrap">
          <button class="btn pick-toggle" type="button">🧲 多选 Commit 并 Pick</button>
          <div class="pick-drop"></div>
        </div>
      </div>`;

    card.querySelector('.del').addEventListener('click', () => {
      card.remove();
      updateCount();
      refreshMergeQueue();
    }, { once: true });
    const check = card.querySelector('.f-check');
    check.addEventListener('change', () => {
      card.classList.toggle('selected', check.checked);
      refreshMergeQueue();
    });
    // 任何字段变化都刷新待合并列表
    card.querySelectorAll('input, textarea').forEach(el => {
      if (el.classList.contains('f-check')) return;  // 已在上面绑定
      el.addEventListener('input', refreshMergeQueue);
    });

    initBranchPicker(card);
    initPickPanel(card);
    return card;
  }

  /* ---------------- 分支选择器 ---------------- */
  // 为卡片初始化：源分支（单选可搜索）+ 目标分支（多选可搜索）
  function initBranchPicker(card) {
    const hostInput = card.querySelector('.f-host');
    const srcInput = card.querySelector('.f-source');
    const srcDrop = card.querySelector('.src-drop');
    const tagsEl = card.querySelector('.bp-tags');
    const tgtInput = card.querySelector('.f-target-input');
    const tgtDrop = card.querySelector('.tgt-drop');
    const tgtTa = card.querySelector('.f-targets');
    const refreshBtn = card.querySelector('.refresh-br');
    let branches = [];          // 已加载的分支列表
    let branchLoading = false;

    function getTargets() {
      return tgtTa.value.split('\n').map(s => s.trim()).filter(Boolean);
    }
    function setTargets(list) {
      tgtTa.value = list.join('\n');
      renderTags();
      refreshMergeQueue();
    }
    function renderTags() {
      const list = getTargets();
      tagsEl.innerHTML = list.map(b =>
        `<span class="bp-tag"><span class="bt">${esc(b)}</span><span class="x" data-b="${esc(b)}">✕</span></span>`
      ).join('');
      tagsEl.querySelectorAll('.x').forEach(x => {
        x.addEventListener('click', () => {
          setTargets(getTargets().filter(b => b !== x.dataset.b));
        });
      });
    }
    renderTags();

    // 暴露闭包给全局面板批量应用使用
    card._setTargets = setTargets;
    card._setSource  = v => { srcInput.value = v; srcInput.dispatchEvent(new Event('input')); };
    card._branches   = () => branches;

    function matches(filter, b) {
      const f = filter.trim().toLowerCase();
      return !f || b.toLowerCase().includes(f);
    }

    function renderDrop(drop, filter, isTarget) {
      if (!branches.length) {
        drop.innerHTML = `<div class="bp-item empty">${
          branchLoading ? '正在加载分支…' : '暂无分支，点击右上角 ⟳ 加载'}</div>`;
        openDrop(drop, drop.parentElement.querySelector('input'));
        return;
      }
      const chosen = isTarget ? new Set(getTargets()) : null;
      const list = branches.filter(b => matches(filter, b));
      if (!list.length) {
        drop.innerHTML = '<div class="bp-item empty">无匹配分支</div>';
        openDrop(drop, drop.parentElement.querySelector('input'));
        return;
      }
      // 已选项置顶 + 分隔线，让多选目标分支一眼可见
      const renderItem = (b, sel) =>
        `<div class="bp-item${sel ? ' sel' : ''}" data-b="${esc(b)}">` +
          `<span class="bp-name">${esc(b)}</span>` +
          `<span class="ck">✓</span>` +
        `</div>`;
      const decorated = list.map(b => ({
        b,
        sel: chosen ? chosen.has(b) : (b === srcInput.value),
      }));
      const selHtml  = decorated.filter(x => x.sel).map(x => renderItem(x.b, true)).join('');
      const restHtml = decorated.filter(x => !x.sel).map(x => renderItem(x.b, false)).join('');
      const divider  = (selHtml && restHtml) ? '<div class="bp-divider"></div>' : '';
      drop.innerHTML = selHtml + divider + restHtml;
      drop.querySelectorAll('.bp-item[data-b]').forEach(it => {
        it.addEventListener('click', () => {
          const b = it.dataset.b;
          if (isTarget) {
            const cur = getTargets();
            if (cur.includes(b)) setTargets(cur.filter(x => x !== b));
            else setTargets([...cur, b]);
            renderDrop(drop, tgtInput.value, true);  // 保持下拉打开，可连续多选
          } else {
            srcInput.value = b;
            srcInput.dispatchEvent(new Event('input'));
            closeDrop(drop);
          }
        });
      });
      openDrop(drop, drop.parentElement.querySelector('input'));
    }

    function hideDrops() {
      closeDrop(srcDrop);
      closeDrop(tgtDrop);
    }
    function closeOnOutside(e) {
      if (!card.contains(e.target)) hideDrops();
    }

    // 源分支：点击/输入时显示下拉
    srcInput.addEventListener('focus', () => renderDrop(srcDrop, srcInput.value, false));
    srcInput.addEventListener('input', () => renderDrop(srcDrop, srcInput.value, false));
    // 目标分支
    tgtInput.addEventListener('focus', () => renderDrop(tgtDrop, tgtInput.value, true));
    tgtInput.addEventListener('input', () => renderDrop(tgtDrop, tgtInput.value, true));
    tgtInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && tgtInput.value.trim()) {
        e.preventDefault();
        const b = tgtInput.value.trim();
        if (!getTargets().includes(b)) setTargets([...getTargets(), b]);
        tgtInput.value = '';
        renderDrop(tgtDrop, '', true);
      }
    });
    function commitTgtInput() {
      const v = tgtInput.value.trim();
      if (v && !getTargets().includes(v)) {
        setTargets([...getTargets(), v]);
        tgtInput.value = '';
      }
    }
    tgtInput.addEventListener('blur', commitTgtInput);
    // outside-click 由全局监听（mousedown）统一处理

    // 加载分支
    async function loadBranches() {
      const host = hostInput.value.trim();
      if (!host) { toast('请先填写 SSH 地址', true); return; }
      branchLoading = true;
      refreshBtn.classList.add('loading');
      try {
        const r = await api('/api/branches', 'POST', {
          ssh_host: host,
          project_path: card.querySelector('.f-path').value.trim(),
          local_dir: card.dataset.localDir,
        });
        branches = r.branches || [];
        if (srcInput.value && !branches.includes(srcInput.value)) branches.push(srcInput.value);
        toast(`已加载 ${branches.length} 个分支`);
      } catch (e) {
        toast(e.message, true);
      } finally {
        branchLoading = false;
        refreshBtn.classList.remove('loading');
      }
    }
    refreshBtn.addEventListener('click', loadBranches);
    card._loadBranches = loadBranches;

    // SSH 地址输入失焦时自动加载分支
    hostInput.addEventListener('blur', () => {
      if (hostInput.value.trim()) loadBranches();
    });
  }

  /* ---------------- Commit Pick 抽屉 ---------------- */
  // 右侧滑出抽屉：选择源分支 commit 并 cherry-pick 到指定目标分支
  // 同时展示目标分支 commit 作为参考
  function initPickPanel(card) {
    const hostInput = card.querySelector('.f-host');
    const pathInput = card.querySelector('.f-path');
    const srcInput  = card.querySelector('.f-source');
    const tgtTa     = card.querySelector('.f-targets');
    const toggleBtn = card.querySelector('.pick-toggle');
    const drop      = card.querySelector('.pick-drop');
    let currentBranch = '';
    let searchKw = '';
    let commits = [];
    let loading = false;
    let viewTargetBranch = '';
    let targetCommits = [];
    let targetLoading = false;

    const getTargets  = () => tgtTa.value.split('\n').map(s => s.trim()).filter(Boolean);
    const getBranches = () => (card._branches ? card._branches() : []);

    // 遮罩层，点击可关闭
    const backdrop = document.createElement('div');
    backdrop.className = 'pick-backdrop';
    card.appendChild(backdrop);

    function render() {
      const branches = getBranches();
      const tgts = getTargets();
      if (!currentBranch && srcInput.value) currentBranch = srcInput.value;
      drop.innerHTML = `
        <div class="pk-head">
          <span class="pk-title">Cherry-Pick</span>
          <select class="pk-src">
            <option value="">选择源分支…</option>
            ${branches.map(b =>
              `<option value="${esc(b)}" ${b === currentBranch ? 'selected' : ''}>${esc(b)}</option>`).join('')}
          </select>
          <button class="pk-close" type="button" aria-label="关闭">&times;</button>
        </div>
        <div class="pk-search-wrap">
          <input class="pk-search" placeholder="搜索源分支 commit（sha / 作者 / 说明）…" value="${esc(searchKw)}">
        </div>
        <div class="pk-list-wrap">
          <div class="pk-list"></div>
        </div>
        <div class="pk-target-section">
          <div class="pk-target-head">
            <span class="pk-target-label">目标分支 commit（参考）</span>
            <select class="pk-view-tgt">
              <option value="">选择目标分支查看…</option>
              ${tgts.map(b => `<option value="${esc(b)}" ${b === viewTargetBranch ? 'selected' : ''}>${esc(b)}</option>`).join('')}
            </select>
          </div>
          <div class="pk-target-list"></div>
        </div>
        <div class="pk-foot">
          <select class="pk-tgt">
            <option value="">选择要 Pick 的目标分支…</option>
            ${tgts.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('')}
          </select>
          <button class="btn primary pk-run" type="button">Pick 到目标分支</button>
        </div>`;
      drop.querySelector('.pk-src').addEventListener('change', e => {
        currentBranch = e.target.value;
        searchKw = '';
        const s = drop.querySelector('.pk-search');
        if (s) s.value = '';
        loadCommits(currentBranch);
      });
      drop.querySelector('.pk-search').addEventListener('input', e => {
        searchKw = e.target.value;
        applySearch();
      });
      drop.querySelector('.pk-view-tgt').addEventListener('change', e => {
        viewTargetBranch = e.target.value;
        loadTargetCommits(viewTargetBranch);
      });
      drop.querySelector('.pk-close').addEventListener('click', closePick);
      drop.querySelector('.pk-run').addEventListener('click', doPick);
      renderList();
      renderTargetList();
    }

    function renderList() {
      const listEl = drop.querySelector('.pk-list');
      if (!listEl) return;
      if (loading) {
        listEl.innerHTML = '<div class="pk-loading"><div class="pk-spin"></div>正在加载 commit…</div>';
        return;
      }
      if (!commits.length) {
        listEl.innerHTML = '<div class="pk-empty">选择上方源分支加载 commit 列表（需先 ⟳ 加载分支）</div>';
        return;
      }
      listEl.innerHTML = commits.map(c => `
        <label class="pk-item" data-kw="${esc((c.subject + ' ' + c.author + ' ' + c.sha).toLowerCase())}">
          <input type="checkbox" class="pk-check" value="${esc(c.sha)}">
          <span class="pk-check-custom"></span>
          <div class="pk-info">
            <div class="pk-msg">${esc(c.subject)}</div>
            <div class="pk-meta-row">
              <span class="pk-sha">${esc(c.short)}</span>
              <span class="pk-author">${esc(c.author)}</span>
              <span class="pk-date">${esc(c.date)}</span>
            </div>
          </div>
        </label>`).join('');
      applySearch();
    }

    function renderTargetList() {
      const listEl = drop.querySelector('.pk-target-list');
      if (!listEl) return;
      if (targetLoading) {
        listEl.innerHTML = '<div class="pk-loading"><div class="pk-spin"></div>正在加载目标分支 commit…</div>';
        return;
      }
      if (!viewTargetBranch) {
        listEl.innerHTML = '<div class="pk-empty">选择上方目标分支查看 commit 列表</div>';
        return;
      }
      if (!targetCommits.length) {
        listEl.innerHTML = '<div class="pk-empty">该分支暂无 commit 记录</div>';
        return;
      }
      listEl.innerHTML = targetCommits.map(c => `
        <div class="pk-item-readonly">
          <span class="pk-readonly-badge">只读</span>
          <div class="pk-info">
            <div class="pk-msg">${esc(c.subject)}</div>
            <div class="pk-meta-row">
              <span class="pk-sha">${esc(c.short)}</span>
              <span class="pk-author">${esc(c.author)}</span>
              <span class="pk-date">${esc(c.date)}</span>
            </div>
          </div>
        </div>`).join('');
    }

    function applySearch() {
      const kw = searchKw.trim().toLowerCase();
      drop.querySelectorAll('.pk-item').forEach(it => {
        it.style.display = (!kw || it.dataset.kw.includes(kw)) ? '' : 'none';
      });
    }

    async function loadCommits(branch) {
      const host = hostInput.value.trim();
      if (!branch) return;
      if (!host) { toast('请先填写 SSH 地址', true); return; }
      loading = true;
      renderList();
      try {
        const r = await api('/api/commits', 'POST', {
          ssh_host: host,
          project_path: pathInput.value.trim(),
          local_dir: card.dataset.localDir,
          source_branch: srcInput.value.trim(),
          target_branches: getTargets(),
          branch,
        });
        commits = r.commits || [];
      } catch (e) {
        commits = [];
        toast('获取 commit 失败: ' + e.message, true);
      } finally {
        loading = false;
        renderList();
      }
    }

    async function loadTargetCommits(branch) {
      const host = hostInput.value.trim();
      if (!branch) { targetCommits = []; renderTargetList(); return; }
      if (!host) { toast('请先填写 SSH 地址', true); return; }
      targetLoading = true;
      renderTargetList();
      try {
        const r = await api('/api/commits', 'POST', {
          ssh_host: host,
          project_path: pathInput.value.trim(),
          local_dir: card.dataset.localDir,
          source_branch: srcInput.value.trim(),
          target_branches: getTargets(),
          branch,
        });
        targetCommits = r.commits || [];
      } catch (e) {
        targetCommits = [];
        toast('获取目标分支 commit 失败: ' + e.message, true);
      } finally {
        targetLoading = false;
        renderTargetList();
      }
    }

    async function doPick() {
      const host = hostInput.value.trim();
      const checked = [...drop.querySelectorAll('.pk-item input:checked')].map(x => x.value);
      const target = drop.querySelector('.pk-tgt').value;
      if (!host) { toast('请先填写 SSH 地址', true); return; }
      if (!checked.length) { toast('请至少勾选一个 commit', true); return; }
      if (!target) { toast('请选择要 Pick 的目标分支', true); return; }
      const btn = drop.querySelector('.pk-run');
      btn.disabled = true;
      btn.textContent = 'Pick 中…';
      try {
        const r = await api('/api/cherry-pick', 'POST', {
          ssh_host: host,
          project_path: pathInput.value.trim(),
          local_dir: card.dataset.localDir,
          source_branch: srcInput.value.trim(),
          target_branches: getTargets(),
          target_branch: target,
          commits: checked,
        });
        toast('✔ ' + (r.message || 'Pick 成功'));
        closePick();
      } catch (e) {
        toast('Pick 失败: ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Pick 到目标分支';
      }
    }

    function openPick() {
      render();
      closeAllDrops();
      backdrop.classList.add('show');
      drop.classList.add('show');
      // 若源分支已默认选中，自动加载 commit；若目标分支已配置，自动加载第一个目标分支
      if (currentBranch) loadCommits(currentBranch);
      const tgts = getTargets();
      if (tgts.length && !viewTargetBranch) {
        viewTargetBranch = tgts[0];
        loadTargetCommits(viewTargetBranch);
      } else if (viewTargetBranch) {
        loadTargetCommits(viewTargetBranch);
      }
    }

    function closePick() {
      backdrop.classList.remove('show');
      drop.classList.remove('show');
    }

    backdrop.addEventListener('click', closePick);

    toggleBtn.addEventListener('click', () => {
      if (drop.classList.contains('show')) { closePick(); return; }
      openPick();
    });
  }

  function render(projects) {
    cardsEl.innerHTML = '';
    (projects || []).forEach(p => cardsEl.appendChild(makeCard(p)));
    updateCount();
    refreshMergeQueue();
    // 自动加载所有已配置 SSH 地址工程的分支，无需手动刷新（静默模式）
    [...cardsEl.children].forEach(card => {
      const host = card.querySelector('.f-host').value.trim();
      if (host && typeof card._loadBranches === 'function') card._loadBranches(true);
    });
  }

  /* ---------------- 全局分支面板 ---------------- */
  // 一个面板同时管理「全局源分支」与「全局目标分支」，
  // 通过按钮可一次性批量覆盖到所有工程卡片。
  function initGlobalPanel() {
    const sshInput   = $('#gSsh');
    const srcInput   = $('#gSrc');
    const srcDrop    = $('#gSrcDrop');
    const tagsEl     = $('#gTags');
    const tgtInput   = $('#gTgtInput');
    const tgtDrop    = $('#gTgtDrop');
    const tgtTa      = $('#gTgts');
    const loadBtn    = $('#gpLoad');
    let branches = [];
    let loading = false;

    function getTargets() {
      return tgtTa.value.split('\n').map(s => s.trim()).filter(Boolean);
    }
    function setTargets(list) {
      const uniq = [...new Set(list.map(s => s.trim()).filter(Boolean))];
      tgtTa.value = uniq.join('\n');
      renderTags();
    }
    function renderTags() {
      const list = getTargets();
      tagsEl.innerHTML = list.map(b =>
        `<span class="bp-tag"><span class="bt">${esc(b)}</span><span class="x" data-b="${esc(b)}">✕</span></span>`
      ).join('');
      tagsEl.querySelectorAll('.x').forEach(x => {
        x.addEventListener('click', () => {
          setTargets(getTargets().filter(b => b !== x.dataset.b));
        });
      });
    }
    function commitTgtInput() {
      const v = tgtInput.value.trim();
      if (v && !getTargets().includes(v)) {
        setTargets([...getTargets(), v]);
        tgtInput.value = '';
      }
    }
    function matches(filter, b) {
      const f = filter.trim().toLowerCase();
      return !f || b.toLowerCase().includes(f);
    }
    function renderDrop(drop, filter, isTarget) {
      if (!branches.length) {
        drop.innerHTML = `<div class="bp-item empty">${
          loading ? '正在加载分支…' : '请先点击 ⟳ 加载分支'}</div>`;
        openDrop(drop, drop.parentElement.querySelector('input'));
        return;
      }
      const chosen = isTarget ? new Set(getTargets()) : null;
      const list = branches.filter(b => matches(filter, b));
      if (!list.length) {
        drop.innerHTML = '<div class="bp-item empty">无匹配分支</div>';
        openDrop(drop, drop.parentElement.querySelector('input'));
        return;
      }
      // 已选项置顶 + 分隔线，让多选目标分支一眼可见
      const renderItem = (b, sel) =>
        `<div class="bp-item${sel ? ' sel' : ''}" data-b="${esc(b)}">` +
          `<span class="bp-name">${esc(b)}</span>` +
          `<span class="ck">✓</span>` +
        `</div>`;
      const decorated = list.map(b => ({
        b,
        sel: chosen ? chosen.has(b) : (b === srcInput.value),
      }));
      const selHtml  = decorated.filter(x => x.sel).map(x => renderItem(x.b, true)).join('');
      const restHtml = decorated.filter(x => !x.sel).map(x => renderItem(x.b, false)).join('');
      const divider  = (selHtml && restHtml) ? '<div class="bp-divider"></div>' : '';
      drop.innerHTML = selHtml + divider + restHtml;
      drop.querySelectorAll('.bp-item[data-b]').forEach(it => {
        it.addEventListener('click', () => {
          const b = it.dataset.b;
          if (isTarget) {
            const cur = getTargets();
            if (cur.includes(b)) setTargets(cur.filter(x => x !== b));
            else setTargets([...cur, b]);
            renderDrop(drop, tgtInput.value, true);
          } else {
            srcInput.value = b;
            closeDrop(drop);
          }
        });
      });
      openDrop(drop, drop.parentElement.querySelector('input'));
    }
    function hideDrops() {
      closeDrop(srcDrop);
      closeDrop(tgtDrop);
    }

    renderTags();
    srcInput.addEventListener('focus', () => renderDrop(srcDrop, srcInput.value, false));
    srcInput.addEventListener('input', () => renderDrop(srcDrop, srcInput.value, false));
    tgtInput.addEventListener('focus', () => renderDrop(tgtDrop, tgtInput.value, true));
    tgtInput.addEventListener('input', () => renderDrop(tgtDrop, tgtInput.value, true));
    tgtInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && tgtInput.value.trim()) {
        e.preventDefault();
        const b = tgtInput.value.trim();
        if (!getTargets().includes(b)) setTargets([...getTargets(), b]);
        tgtInput.value = '';
        renderDrop(tgtDrop, '', true);
      }
    });
    tgtInput.addEventListener('blur', commitTgtInput);
    // outside-click 由全局监听（mousedown）统一处理

    async function loadBranches(silent) {
      const host = sshInput.value.trim();
      if (!host) { if (!silent) toast('请先填写 SSH 地址', true); return; }
      loading = true;
      loadBtn.classList.add('loading');
      try {
        const r = await api('/api/branches', 'POST', {
          ssh_host: host,
          project_path: '',
        });
        branches = r.branches || [];
        // 当前已填值若不在远端列表里也保留可见
        if (srcInput.value && !branches.includes(srcInput.value)) branches.unshift(srcInput.value);
        getTargets().forEach(b => { if (!branches.includes(b)) branches.push(b); });
        if (!silent) {
          toast(`已加载 ${r.branches.length} 个分支`);
          srcInput.focus();
        }
        renderDrop(srcDrop, srcInput.value, false);
      } catch (e) {
        if (!silent) toast(e.message, true);
      } finally {
        loading = false;
        loadBtn.classList.remove('loading');
      }
    }
    loadBtn.addEventListener('click', () => loadBranches(false));

    function applySource() {
      const v = srcInput.value.trim();
      if (!v) { toast('请先填写全局源分支', true); return null; }
      const cards = cardsEl.children;
      if (!cards.length) { toast('暂无工程', true); return 0; }
      [...cards].forEach(card => card._setSource && card._setSource(v));
      refreshMergeQueue();
      return cards.length;
    }
    function applyTargets() {
      commitTgtInput();
      const list = getTargets();
      if (!list.length) { toast('请先填写全局目标分支', true); return null; }
      const cards = cardsEl.children;
      if (!cards.length) { toast('暂无工程', true); return 0; }
      [...cards].forEach(card => card._setTargets && card._setTargets(list));
      return cards.length;
    }
    $('#gpApplySrc').addEventListener('click', () => {
      const n = applySource();
      if (n) toast(`已将全局源分支应用到 ${n} 个工程`);
    });
    $('#gpApplyTgt').addEventListener('click', () => {
      const list = getTargets();
      const n = applyTargets();
      if (n) toast(`已将全局目标分支（${list.length}）应用到 ${n} 个工程`);
    });
    $('#gpApplyAll').addEventListener('click', () => {
      commitTgtInput();
      const n = applySource();
      const list = getTargets();
      const m = applyTargets();
      if (!n && !m) return;
      toast(`已批量应用：源分支 → ${n || 0} 工程 / 目标分支 → ${m || 0} 工程`);
    });

    // 暴露 setter 给 init() 恢复持久化值
    initGlobalPanel.setValues = (g = {}) => {
      if (typeof g.ssh_host === 'string') sshInput.value = g.ssh_host;
      if (typeof g.source_branch === 'string') srcInput.value = g.source_branch;
      if (Array.isArray(g.target_branches)) setTargets(g.target_branches);
    };
    // 暴露收集器供保存按钮使用
    initGlobalPanel.collect = () => ({
      ssh_host: sshInput.value.trim(),
      source_branch: srcInput.value.trim(),
      target_branches: getTargets(),
    });
  }
  initGlobalPanel();

  function updateCount() {
    $('#count').textContent = cardsEl.children.length + ' 个工程';
  }

  function refreshMergeQueue() {
    const queueEl = $('#mergeQueue');
    const items = [...cardsEl.children].map(card => {
      const checked = card.querySelector('.f-check').checked;
      const host = card.querySelector('.f-host').value.trim();
      const name = card.dataset.name || (host.split('/').pop() || host) || '未命名工程';
      const src = card.querySelector('.f-source').value.trim();
      const tgts = card.querySelector('.f-targets').value
        .split('\n').map(s => s.trim()).filter(Boolean);
      return { card, checked, name, host, src, tgts };
    });
    const checkedItems = items.filter(x => x.checked);
    $('#queueCount').textContent = checkedItems.length;
    if (!checkedItems.length) {
      queueEl.innerHTML = '<div class="queue-empty">暂未勾选「参与合并」的工程</div>';
      return;
    }
    queueEl.innerHTML = checkedItems.map(x => {
      const warn = !x.host || !x.src || !x.tgts.length;
      const flow = x.src
        ? `<span class="qsource">${esc(x.src || '?')}</span><span class="qarrow">→</span>` +
          (x.tgts.length
            ? x.tgts.map(t => `<span class="qtarget">${esc(t)}</span>`).join('<span class="qarrow">,</span>')
            : '<span class="qtarget">?目标</span>')
        : '<span style="color:var(--muted)">未填写分支</span>';
      const missing = [];
      if (!x.host) missing.push('SSH 地址');
      if (!x.src) missing.push('源分支');
      if (!x.tgts.length) missing.push('目标分支');
      const warnTip = warn
        ? `<div class="qwarn">⚠ 缺少：${missing.join('、')}</div>` : '';
      return `<div class="qitem${warn ? ' warn' : ''}">
        <div class="qname"><span class="qname-text">${esc(x.name)}</span></div>
        <div class="qflow">${flow}</div>${warnTip}
      </div>`;
    }).join('');
  }

  function collect() {
    return [...cardsEl.children].map(card => ({
      _checked: card.querySelector('.f-check').checked,
      name: card.dataset.name,
      ssh_host: card.querySelector('.f-host').value.trim(),
      project_path: card.querySelector('.f-path').value.trim(),
      source_branch: card.querySelector('.f-source').value.trim(),
      target_branches: card.querySelector('.f-targets').value
        .split('\n').map(s => s.trim()).filter(Boolean),
      local_dir: card.dataset.localDir,
    }));
  }

  /* ---------------- 文件夹扫描 ---------------- */
  const scanListEl = $('#scanList');

  function renderScanResult(repos, warnings = []) {
    scanListEl.classList.add('show');
    const warnHtml = warnings.length
      ? `<div class="scan-empty" style="color:#e3a008">⚠ 部分目录无法读取：<br>${warnings.map(esc).join('<br>')}</div>`
      : '';
    if (!repos.length) {
      scanListEl.innerHTML = warnHtml + '<div class="scan-empty">该文件夹下没有发现 git 仓库（未找到 .git/config 或 remote origin）</div>';
      return;
    }
    scanListEl.innerHTML = `
      <div class="scan-list-head">
        <span>共发现 ${repos.length} 个工程</span>
        <span class="chk" style="cursor:pointer">
          <input type="checkbox" id="scanSelAll"> 全选
        </span>
      </div>
      <div id="scanItems">${repos.map(r => `
        <div class="scan-item" data-index="${repos.indexOf(r)}">
          <input type="checkbox" class="s-check">
          <div class="info">
            <div class="sname">${esc(r.name)}</div>
            <div class="surl">${esc(r.ssh_host || '(无地址)')}</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="scan-hint" style="color:var(--muted)">勾选工程即自动加入下方工程配置，取消勾选则移除（已填写分支的卡片会保留）。</div>`;

    const items = [...scanListEl.querySelectorAll('.scan-item')];
    const applyItem = (it, checked) => {
      const repo = repos[+it.dataset.index];
      it.classList.toggle('selected', checked);
      if (checked) addScannedProject(repo);
      else removeScannedProject(repo);
    };
    items.forEach((it, i) => {
      const cb = it.querySelector('.s-check');
      cb.addEventListener('change', () => applyItem(it, cb.checked));
      it.addEventListener('click', e => {
        if (e.target === cb) return;
        cb.checked = !cb.checked;
        applyItem(it, cb.checked);
      });
    });

    const selAll = $('#scanSelAll');
    selAll.addEventListener('change', () => {
      items.forEach(it => applyItem(it, selAll.checked));
    });
  }

  function findCardByHost(host) {
    return [...cardsEl.children].find(
      c => c.querySelector('.f-host').value.trim() === host);
  }

  function addScannedProject(p) {
    if (!p.ssh_host) return;
    if (findCardByHost(p.ssh_host)) return;  // 已存在则跳过
    const card = makeCard({
      name: p.name,
      ssh_host: p.ssh_host,
      project_path: p.project_path,
      local_dir: p.path,   // 直接使用本地仓库目录，避免重复 clone
    });
    cardsEl.appendChild(card);
    updateCount();
    toast(`已加入工程：${p.name}`, false);
    // 自动加载该工程的分支
    if (typeof card._loadBranches === 'function') {
      card._loadBranches();
    }
  }

  function removeScannedProject(p) {
    const card = findCardByHost(p.ssh_host);
    if (!card) return;
    // 已填写分支的卡片保留，避免误删用户输入
    const filled = card.querySelector('.f-source').value.trim()
      || card.querySelector('.f-targets').value.trim();
    if (filled) {
      toast(`「${card.dataset.name || p.name}」已填写分支，保留在配置中`, true);
      return;
    }
    card.remove();
    updateCount();
    toast(`已移除工程：${p.name || card.dataset.name}`, false);
  }

  /* ---------------- 日志 ---------------- */
  function appendLogs(entries) {
    entries.forEach(([id, text]) => {
      const line = document.createElement('div');
      const cls = text.includes('[ERROR]') ? 'error'
        : text.includes('[WARNING]') ? 'warn' : 'info';
      line.className = cls;
      line.textContent = text;
      logEl.appendChild(line);
    });
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLog() {
    logEl.innerHTML = '';
    lastLogId = 0;
  }

  /* ---------------- 执行 ---------------- */
  async function runMerge() {
    if (busy) return;
    const selected = collect().filter(c => c._checked);
    if (!selected.length) { toast('请至少勾选一个要执行的工程', true); return; }
    for (let i = 0; i < selected.length; i++) {
      const s = selected[i];
      if (!s.ssh_host || !s.source_branch || !s.target_branches.length) {
        toast(`第 ${i + 1} 个工程配置不完整`, true); return;
      }
    }
    // 任务开始：展开执行面板，方便看实时日志
    setExecPanelCollapsed(false);
    try {
      await api('/api/clear', 'POST', {});
    } catch (e) {}
    clearLog();
    const payload = selected.map(({ _checked, ...rest }) => rest);
    try {
      const r = await api('/api/merge', 'POST', { projects: payload });
      if (r.status === 'started') startPolling();
    } catch (e) { toast(e.message, true); }
  }

  function startPolling() {
    busy = true;
    updateUi();
    pollTimer = setInterval(async () => {
      try {
        const [lr, st] = await Promise.all([
          api('/api/logs?since=' + lastLogId),
          api('/api/state'),
        ]);
        if (lr.logs.length) {
          appendLogs(lr.logs);
          lastLogId = lr.since;
        }
        busy = st.busy;
        updateUi();
        if (!busy) { clearInterval(pollTimer); pollTimer = null; }
      } catch (e) { console.error(e); }
    }, 800);
  }

  /* ---------------- UI ---------------- */
  function updateUi() {
    $('#mergeBtn').disabled = busy;
    $('#spinner').classList.toggle('show', busy);
    $('#mergeBtnText').textContent = busy ? '合并进行中…' : '开始合并';
    $('#dot').classList.toggle('running', busy);
    $('#statusText').textContent = busy ? '任务运行中' : '空闲';
    cardsEl.querySelectorAll('input, textarea').forEach(el => el.disabled = busy);
  }

  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = 'show' + (isErr ? ' error' : ' ok');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.className = '', 2600);
  }

  /* ---------------- 事件 ---------------- */
  $('#addBtn').addEventListener('click', () => {
    cardsEl.appendChild(makeCard({}));
    updateCount();
    cardsEl.lastElementChild.querySelector('.f-host').focus();
  });

  $('#saveBtn').addEventListener('click', async () => {
    const projects = collect().map(({ _checked, ...rest }) => rest);
    if (!projects.length) { toast('请先添加工程', true); return; }
    try {
      const global = initGlobalPanel.collect();
      const r = await api('/api/save', 'POST', { projects, global });
      render(r.projects);
      toast('配置已保存');
    } catch (e) { toast('保存失败: ' + e.message, true); }
  });

  $('#scanBtn').addEventListener('click', async () => {
    const folder = $('#scanFolder').value.trim();
    if (!folder) { toast('请输入文件夹路径', true); return; }
    if (busy) { toast('任务运行中，暂不能扫描', true); return; }
    scanListEl.classList.add('show');
    scanListEl.innerHTML = '<div class="scan-loading"><span class="spinner"></span>正在读取文件夹…</div>';
    try {
      const r = await api('/api/scan', 'POST', { folder });
      renderScanResult(r.repos || [], r.warnings || []);
    } catch (e) {
      scanListEl.innerHTML = `<div class="scan-empty">${esc(e.message)}</div>`;
    }
  });

  $('#mergeBtn').addEventListener('click', runMerge);
  $('#clearLogBtn').addEventListener('click', async () => {
    clearLog();
    try { await api('/api/clear', 'POST', {}); } catch (e) {}
  });

  /* ---------------- 执行面板折叠 ---------------- */
  function setExecPanelCollapsed(collapsed) {
    const p = $('#execPanel'); if (!p) return;
    p.classList.toggle('collapsed', !!collapsed);
    try { localStorage.setItem('execCollapsed', collapsed ? '1' : '0'); } catch (e) {}
  }
  $('#execToggleBtn').addEventListener('click', () => {
    setExecPanelCollapsed(!$('#execPanel').classList.contains('collapsed'));
  });

  /* ---------------- 下拉浮层全局事件 ---------------- */
  // 点击或滚动后关闭所有未命中的下拉
  document.addEventListener('mousedown', (e) => {
    [...__OPEN_DROPS__].forEach(d => {
      if (d.contains(e.target)) return;
      const wrap = d.parentElement;
      if (wrap && wrap.contains(e.target)) return;
      closeDrop(d);
    });
  }, true);
  // 仅在对应 input 已被滚出视口（错位）时才关闭浮层。
  // 否则浮层内部的滚动浏览其他分支时也会被误关。
  window.addEventListener('scroll', () => {
    [...__OPEN_DROPS__].forEach(d => {
      const input = d.parentElement && d.parentElement.querySelector('input');
      if (!input) { closeDrop(d); return; }
      const r = input.getBoundingClientRect();
      if (r.bottom > 0 && r.top < window.innerHeight) return;  // 仍在视口内 → 保留
      closeDrop(d);
    });
  }, true);
  window.addEventListener('resize', () => {
    [...__OPEN_DROPS__].forEach(d => {
      const input = d.parentElement && d.parentElement.querySelector('input');
      if (!input) { closeDrop(d); return; }
      const r = input.getBoundingClientRect();
      if (r.bottom > 0 && r.top < window.innerHeight) return;
      closeDrop(d);
    });
  });

  /* ---------------- 启动 ---------------- */
  (async function init() {
    try {
      // 恢复用户上次选择的执行面板折叠状态
      try {
        if (localStorage.getItem('execCollapsed') === null) {
          setExecPanelCollapsed(false);   // 默认展开（首次访问）
        } else {
          setExecPanelCollapsed(localStorage.getItem('execCollapsed') === '1');
        }
      } catch (e) { setExecPanelCollapsed(false); }

      const st = await api('/api/state');
      render(st.projects);
      if (st.global) initGlobalPanel.setValues(st.global);
      if (st.busy) {
        setExecPanelCollapsed(false);   // 运行中自动展开面板
        startPolling();
      } else {
        updateUi();
      }
    } catch (e) {
      toast('加载失败: ' + e.message, true);
    }
  })();
})();
</script>
</body>
</html>
